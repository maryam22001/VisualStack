name: CI

# Runs on every push and pull request. Mirrors `npm run check` and then proves the app
# actually boots against a REAL PostgreSQL: migrations apply, nothing is missing from
# schema.prisma vs the migrations, and the smoke test passes (API + built web app).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visualstack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visualstack?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client + schema validation
        run: npm run db:generate && npm run db:validate

      - name: Type-check, lint, unit/API tests, production build
        run: npm run typecheck && npm run lint && npm run test && npm run build

      - name: Apply migrations to a real PostgreSQL
        run: npm run db:deploy

      - name: schema.prisma must be fully covered by committed migrations
        # Exits non-zero if schema.prisma differs from what the migrations produce
        # (i.e. someone changed the schema but forgot `npm run db:migrate`).
        run: npm exec --workspace=apps/server -- prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Boot the server and smoke-test it
        env:
          NODE_ENV: production
          SERVE_WEB: 'true'
          PORT: '5000'
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -fs http://localhost:5000/api/health && break
            sleep 1
          done
          API_URL=http://localhost:5000 WEB=1 npm run smoke
